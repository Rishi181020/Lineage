<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lineage</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <form id="auth" class="banner" hidden>
    <label for="token">Lineage rejected the operator token. Paste the value it was started with:</label>
    <input id="token" type="password" autocomplete="off" required />
    <button class="btn" type="submit">Save token</button>
  </form>
  <div id="setup" class="banner problem" role="alert" hidden></div>

  <div class="app">
    <aside class="side">
      <h1 class="wordmark">Lineage</h1>
      <nav class="views" aria-label="Views">
        <button type="button" data-view="agents" aria-current="true">Agents</button>
        <button type="button" data-view="attacker">Attacker</button>
        <button type="button" data-view="scorecard">Scorecard</button>
      </nav>
      <form id="new-agent">
        <label for="task">What should the agent do?</label>
        <textarea id="task" rows="4" maxlength="8000" required placeholder="Investigate the open errortrack issues and apply the fixes"></textarea>
        <fieldset class="protection">
          <legend>Protection</legend>
          <label><input type="radio" name="protection" value="lineage" checked /> Lineage</label>
          <label><input type="radio" name="protection" value="baseline" /> Normal gateway only</label>
        </fieldset>
        <div id="model-field" class="field" hidden>
          <label for="model">Model</label>
          <select id="model"></select>
        </div>
        <p id="workspace" class="hint"></p>
        <button id="start" class="btn primary" type="submit" disabled>Start agent</button>
        <p id="start-error" class="error" role="alert" hidden></p>
      </form>
      <h2>Agents</h2>
      <ul id="agents" class="agents"></ul>
    </aside>
    <main id="agent" class="main"></main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
