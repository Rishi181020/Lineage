name: lineage

x-python-healthcheck: &python-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
  interval: 5s
  timeout: 3s
  retries: 10
  start_period: 3s

services:
  control:
    build:
      context: .
      dockerfile: control/Dockerfile
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      LINEAGE_REGION: ${LINEAGE_REGION:-us-west-2}
      LINEAGE_MODE: local
      LINEAGE_POLICY_PATH: /app/policy/default.yaml
      LINEAGE_LOCAL_SECRETS_PATH: /app/.lineage/secrets.yaml
      LINEAGE_OPERATOR_TOKEN_PATH: /app/.lineage/operator-token
      LINEAGE_SERVICE_TOKEN_PATH: /app/.lineage/service-token
      LINEAGE_OPERATOR_TOKEN: ${LINEAGE_OPERATOR_TOKEN:-lineage-operator-dev}
      LINEAGE_SERVICE_TOKEN: ${LINEAGE_SERVICE_TOKEN:-lineage-service-dev}
      LINEAGE_LOCAL_SIGNING_KEY: ${LINEAGE_LOCAL_SIGNING_KEY:-lineage-local-development-key-32b!}
      LINEAGE_RUNNER_URL: http://runner:8200
      LINEAGE_MODELTAP_URL: http://172.30.0.12:8100
      LINEAGE_COLLECTOR_URL: http://collector.demo
      STAGING_REAL_TOKEN: ${STAGING_REAL_TOKEN:-lineage_demo_real_staging_token}
    volumes:
      - ./.lineage:/app/.lineage
      - ./policy:/app/policy:ro
    networks:
      sandbox:
        ipv4_address: 172.30.0.10
      uplink: {}
    healthcheck: *python-healthcheck

  egress:
    build:
      context: .
      dockerfile: egress/Dockerfile
    environment:
      LINEAGE_CONTROL_INTERNAL: http://172.30.0.10:8002
      LINEAGE_SERVICE_TOKEN: ${LINEAGE_SERVICE_TOKEN:-lineage-service-dev}
      LINEAGE_POLICY_PATH: /app/policy/default.yaml
      LINEAGE_LOCAL_SECRETS_PATH: /app/.lineage/secrets.yaml
      STAGING_REAL_TOKEN: ${STAGING_REAL_TOKEN:-lineage_demo_real_staging_token}
    volumes:
      - ./.lineage:/app/.lineage:ro
      - ./policy:/app/policy:ro
    networks:
      sandbox:
        ipv4_address: 172.30.0.11
      uplink: {}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  modeltap:
    build:
      context: .
      dockerfile: modeltap/Dockerfile
    environment:
      LINEAGE_REGION: ${LINEAGE_REGION:-us-west-2}
      LINEAGE_MODE: ${LINEAGE_MODE:-local}
      LINEAGE_CONTROL_INTERNAL: http://172.30.0.10:8002
      LINEAGE_SERVICE_TOKEN: ${LINEAGE_SERVICE_TOKEN:-lineage-service-dev}
      LINEAGE_LOCAL_SIGNING_KEY: ${LINEAGE_LOCAL_SIGNING_KEY:-lineage-local-development-key-32b!}
      LINEAGE_MODEL_ID: ${LINEAGE_MODEL_ID:-}
    volumes:
      # shortcut: default AWS profile only; pass AWS_PROFILE through if you need another.
      - ${AWS_CONFIG_DIR:-${USERPROFILE:-${HOME}}/.aws}:/root/.aws:ro
    networks:
      sandbox:
        ipv4_address: 172.30.0.12
      uplink: {}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  stub-infra:
    build:
      context: stubs
    command: ["uvicorn", "infra.app:app", "--host", "0.0.0.0", "--port", "80"]
    environment:
      STAGING_REAL_TOKEN: ${STAGING_REAL_TOKEN:-lineage_demo_real_staging_token}
    networks:
      uplink:
        aliases: [infra.demo]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  stub-collector:
    build:
      context: stubs
    command: ["uvicorn", "collector.app:app", "--host", "0.0.0.0", "--port", "80"]
    networks:
      uplink:
        # errortrack.demo stands in for an attacker's project on the team's own error tracker.
        aliases: [collector.demo, errortrack.demo]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  stub-registry:
    build:
      context: stubs
    command: ["uvicorn", "registry.app:app", "--host", "0.0.0.0", "--port", "80"]
    networks:
      uplink:
        aliases: [registry.demo]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Starts agent containers for the web app. It holds the Docker socket, so it sits
  # only on uplink, where agents can't reach it, and only runs one fixed container shape.
  runner:
    build:
      context: runner
    environment:
      LINEAGE_SERVICE_TOKEN: ${LINEAGE_SERVICE_TOKEN:-lineage-service-dev}
      LINEAGE_CONTROL_INTERNAL: http://control:8002
      LINEAGE_AGENT_IMAGE: lineage-agent-shell:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The folder agents work on. Each agent gets its own copy, so this stays untouched.
      - ${LINEAGE_WORKSPACE:-./fixtures/demo-repo}:/workspace-src:ro
    networks:
      uplink: {}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Only here so `docker compose up --build` builds the image the runner starts.
  agent-image:
    image: lineage-agent-shell:latest
    build:
      context: agent-image
      additional_contexts:
        fixtures: ./fixtures
    command: ["true"]
    network_mode: none

  agent-shell:
    profiles: [tools]
    image: lineage-agent-shell:latest
    command: ["sleep", "infinity"]
    dns: 127.0.0.1
    extra_hosts:
      - "control:172.30.0.10"
      - "egress:172.30.0.11"
      - "modeltap:172.30.0.12"
    networks:
      sandbox: {}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  uplink:
    driver: bridge
  sandbox:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
