mode_default: interactive
label_untrusted: true
allowlist:
  hosts: [registry.demo]
  packages: []
egress:
  # errortrack.demo is the team's error tracker, so a normal gateway allows it too. An attacker
  # with their own project there can receive anything sent to it, like real SaaS exfiltration.
  # It is reachable, not trusted: it is deliberately absent from allowlist.hosts above.
  allow_hosts: [infra.demo, registry.demo, errortrack.demo]
stubs: [infra.demo, collector.demo, registry.demo, errortrack.demo]
strict:
  allow:
    - {methods: [GET, POST], host: infra.demo, path: "/v1/envs/staging/**"}
drip: {max_distinct_paths: 8, window_s: 60, max_body_bytes: 512, min_substring: 8}
secret_patterns: [".env", ".env.*", "*.pem", "id_rsa*", "~/.aws/*", "~/.npmrc", "~/.netrc"]
manifest_patterns: [package.json, package-lock.json, pnpm-lock.yaml, yarn.lock, requirements*.txt, pyproject.toml, poetry.lock, uv.lock]
bindings:
  staging-infra:
    env_var: STAGING_TOKEN
    secret_ref: lineage/custody/staging-infra
    header: Authorization
    scheme: Bearer
    hosts: [infra.demo]
    allow:
      - {methods: [GET, POST], path: "/v1/envs/staging/**"}
    deny:
      - {methods: [DELETE], path: "/**"}
      - {methods: ["*"], path: "/v1/envs/production/**"}
