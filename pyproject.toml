[project]
name = "lineage"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
  "pydantic-settings",
  "httpx",
  "pyyaml",
  "bashlex",
  "cryptography",
  "PyJWT",
  "boto3",
  "botocore",
]

[project.scripts]
lineage = "launcher.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.uv.workspace]
members = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lineage_core", "control", "egress", "modeltap", "launcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
